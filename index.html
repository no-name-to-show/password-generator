<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <meta name="description"
        content="Generate secure and memorable passwords instantly. A simple open-source password generator designed to help create strong credentials.">

    <meta name="keywords"
        content="password generator, secure password, random password, strong password, cybersecurity">

    <meta name="author" content="no-name-to-show">

    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:title" content="Password Generator">
    <meta property="og:description"
        content="Generate secure and memorable passwords instantly with this open-source password generator.">
    <meta property="og:type" content="website">
    <meta property="og:url"
        content="https://no-name-to-show.github.io/password-generator/">

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Password Generator">
    <meta name="twitter:description"
        content="Generate secure and memorable passwords instantly.">

    <link rel="stylesheet" href="index.css">
</head>

<body id="google_translate_element">

    <header class="main-header-container">
        <h1>
            A website where you can generate your own password
        </h1>
    </header>

    <main class="main-body-container">
        <section>
            <header>
                <h2>Get Your Password</h2>
            </header>

            <form class="password-generator-main-container">
                <fieldset>
                    <label for="generated-password">
                        Generated Password
                    </label>

                    <input type="text" id="inputGeneratedPassword" readonly placeholder="Click 'Generate' to start">

                    <small class="password-note">
                        This password is automatically generated as a suggestion. It should be reviewed before using it
                        for important accounts.
                    </small>
                </fieldset>

                <button type="button" id="btnGeneratePassword">
                    Generate
                </button>
            </form>
        </section>
    </main>

    <footer>
        Website Open Source
    </footer>
    <script type="module" src="./js/index.js"></script>
</body>

</html>
