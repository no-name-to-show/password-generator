<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Password Generator | Open Source Password Creator</title>

    <meta name="description"
        content="Generate secure, memorable, and customizable passwords instantly. Free and open-source password generator focused on security and usability.">

    <meta name="keywords"
        content="password generator, secure password generator, random password, strong password, memorable password, cybersecurity, password creator">

    <meta name="author" content="AJ">
    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://no-name-to-show.github.io/password-generator/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Password Generator">
    <meta property="og:description"
        content="Generate secure, memorable, and customizable passwords instantly with this free open-source password generator.">
    <meta property="og:url" content="https://no-name-to-show.github.io/password-generator/">
    <meta property="og:image"
        content="https://no-name-to-show.github.io/password-generator/assets/web-icon/PasswordGenerator.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Password Generator app preview">
    <meta property="og:site_name" content="Password Generator">
    <meta property="og:locale" content="en_US">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Password Generator">
    <meta name="twitter:description" content="Generate secure, memorable, and customizable passwords instantly.">
    <meta name="twitter:image"
        content="https://no-name-to-show.github.io/password-generator/assets/web-icon/PasswordGenerator.png">
    <meta name="twitter:image:alt" content="Password Generator app preview">

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a">

    <!-- Favicon -->
    <link rel="icon" href="./assets/web-icon/PasswordGenerator.png" type="image/png">

    <link rel="stylesheet" href="index.css">
</head>

<body id="bodyContainer">

    <header class="main-header-container">
        <h1>
            A website where you can generate your own password
        </h1>
    </header>

    <main class="main-body-container">
        <section>
            <header>
                <h2>Get Your Password</h2>
            </header>
            <div class="symbol-panel-container">
                <div class="choice-panel" id="symbolChoicePanel"></div>

                <label>
                    <input type="checkbox" id="selectAllSymbols"> Seleccionar todo
                </label>

                <div class="symbol-panel-options-container">
                    <button type="button" id="saveSymbolsBtn">Guardar</button>
                    <button type="button" id="cancelSymbolsBtn">Cancelar</button>
                </div>
            </div>
            <form class="password-generator-main-container" id="passwordFormContainer">
                <fieldset>
                    <div class="form-menu">
                        <label for="inputGeneratedPassword">
                            Generated Password
                        </label>
                        <div>
                            <a href="#" id="clearWebCache" aria-label="Clear generated password" class="tooltip"
                                data-tooltip="Clear generated password">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-trash">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path d="M4 7l16 0" />
                                    <path d="M10 11l0 6" />
                                    <path d="M14 11l0 6" />
                                    <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                                    <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
                                </svg>
                            </a>
    
                            <a href="#" id="symbolPanelBtn" aria-label="Choose password symbols" class=" tooltip"
                                data-tooltip="Clear generated password">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="icon icon-tabler icons-tabler-outline icon-tabler-menu-2">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path d="M4 6l16 0" />
                                    <path d="M4 12l16 0" />
                                    <path d="M4 18l16 0" />
                                </svg>
                            </a>
                        </div>
                    </div>

                    <div class="neon-input-wrapper">
                        <input type="text" id="inputGeneratedPassword" readonly placeholder="Click 'Generate' to start">
                    </div>

                    <small class="password-note">
                        This password is automatically generated as a suggestion. It should be reviewed before using it
                        for important accounts.
                    </small>
                </fieldset>
                <button type="button" id="btnGeneratePassword">
                    Generate
                </button>
            </form>
        </section>
    </main>

    <footer>
        <a href="https://github.com/no-name-to-show/password-generator" target="_blank" rel="noopener noreferrer">
            Open Source on GitHub
        </a>
    </footer>
    <script type="module" src="./js/index.js"></script>
</body>

</html>
